services:
  - type: web
    name: sign-ai-classroom
    env: python
    region: oregon  # Change to your preferred region
    plan: free      # Upgrade for persistent disk (required for SQLite persistence)

    # Python version — must match .python-version in repo root
    # mediapipe==0.10.21 requires Python 3.10 (no wheel exists for 3.12)
    pythonVersion: "3.10.12"

    # Build command — installs runtime dependencies
    buildCommand: pip install -r requirements.txt

    # Start command — Flask-SocketIO 5.x with eventlet uses socketio.run()
    startCommand: python app.py

    # Health check — Render pings this to verify the service is alive
    healthCheckPath: /health

    # Environment variables — set real values in the Render dashboard
    envVars:
      - key: SECRET_KEY
        generateValue: true       # Render auto-generates a secure random value

      - key: PORT
        value: 10000              # Render assigns this automatically; keep default

      - key: SOCKETIO_CORS_ORIGINS
        value: "*"                # Restrict to your domain after prototype phase

    # IMPORTANT: SQLite data directory
    # Free plan does NOT provide persistent disk — data is lost on redeploy.
    # Upgrade to a paid plan and mount a disk at /opt/render/project/src/data
    # or migrate to PostgreSQL for production persistence.
