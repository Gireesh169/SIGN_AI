<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Virtual Classroom | Multilingual Inclusive Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/classroom.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span>🌐</span>
            <a href="/" style="color: inherit; text-decoration: none; font-weight: 800;">Multilingual Inclusive Classroom</a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/history">History</a>
        </div>
    </nav>

    <div class="container" style="max-width: 650px; margin-top: 2rem;">
        <div class="glass-card">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; color: var(--text-main);">👨‍🏫 Create Virtual Classroom</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem;">Configure classroom settings and select your primary teaching language.</p>

            <form action="/api/create_room" method="POST">
                <div class="form-group">
                    <label>Teacher Name *</label>
                    <input type="text" name="teacher_name" class="form-control" placeholder="e.g. Prof. Sharma" required>
                </div>

                <!-- FIRST-TIME TEACHER LANGUAGE SELECTION -->
                <div class="form-group" style="background: var(--primary-light); border: 1px solid var(--primary-border); padding: 1.25rem; border-radius: 0.75rem;">
                    <label style="color: var(--primary-color); font-weight: 700; font-size: 0.95rem;">🌐 What language will you use for teaching? *</label>
                    <p style="font-size: 0.825rem; color: var(--text-muted); margin-bottom: 0.6rem;">Your speech will be transcribed in this language and automatically translated for each student.</p>
                    <select name="teacher_language" class="form-control" style="background: #ffffff; color: var(--text-main); font-size: 1rem; font-weight: 600;">
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi (हिन्दी)</option>
                        <option value="te">Telugu (తెలుగు)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Classroom / Room Name *</label>
                    <input type="text" name="room_name" class="form-control" placeholder="e.g. Inclusive Primary Class" required>
                </div>

                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" name="subject" class="form-control" placeholder="e.g. Science & Mathematics" required>
                </div>

                <div class="form-group">
                    <label>Description (Optional)</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Brief description of classroom learning objectives..."></textarea>
                </div>

                <div class="form-group">
                    <label>Maximum Students</label>
                    <input type="number" name="max_students" class="form-control" value="30" min="1" max="100">
                </div>

                <div class="form-group">
                    <label>Optional Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Leave blank for open access">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem; margin-top: 1rem;">🚀 Generate Room Code & Launch</button>
            </form>
        </div>
    </div>
</body>
</html>
