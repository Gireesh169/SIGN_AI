<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL Real-Time Sentence Recognition (252D Pipeline)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-green: #238636;
            --accent-red: #da3633;
            --text-primary: #c9d1d9;
            --text-heading: #f0f6fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            color: var(--text-heading);
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .camera-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .video-wrapper {
            width: 100%;
            max-height: 65vh;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cameraStream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .status-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            gap: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #8b949e;
        }

        .dot.active { background: #3fb950; }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            width: 100%;
            justify-content: center;
        }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-clear { background-color: #21262d; color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-clear:hover { background-color: #30363d; }

        .prediction-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-box {
            text-align: center;
            background: #0d1117;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .sentence-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #8b949e;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .sentence-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent-color);
            min-height: 2.4rem;
        }

        .meter-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meter-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #21262d;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950, #58a6ff);
            transition: width 0.3s ease;
        }

        .audio-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #f0883e;
            font-weight: 600;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ISL REAL-TIME SENTENCE RECOGNITION</h1>
        <div class="subtitle">252D Position + Causal Velocity Landmark Model (36.08% Top-1 / 70.10% Top-5 Test Accuracy)</div>
    </header>

    <div class="main-container">
        <div class="camera-card">
            <div class="video-wrapper">
                <!-- Server-Side OpenCV Live Camera Stream -->
                <img id="cameraStream" src="/video_feed" alt="Live Camera Stream">

                <div class="status-overlay">
                    <div class="status-item"><div class="dot" id="handDot"></div> <span id="handText">0 Hands</span></div>
                    <div class="status-item"><div class="dot" id="bufferDot"></div> <span id="bufferText">0/30 Frames</span></div>
                    <div class="status-item"><span id="fpsText">0.0 FPS</span></div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-clear" onclick="clearBuffer()">Clear Buffer</button>
            </div>

            <div style="margin-top: 15px; width: 100%; border-top: 1px solid var(--border-color); padding-top: 15px; text-align: center;">
                <div style="font-size: 0.85rem; color: #8b949e; margin-bottom: 8px;">Or Test With Video File Upload</div>
                <input type="file" id="videoFileInput" accept="video/*" style="display: none;" onchange="handleFileUpload(event)">
                <button class="btn-clear" onclick="document.getElementById('videoFileInput').click()">Upload Video File</button>
                <span id="uploadStatus" style="font-size: 0.85rem; color: var(--accent-color); margin-left: 10px;"></span>
            </div>
        </div>

        <div class="prediction-panel">
            <div class="sentence-box">
                <div class="sentence-title">Recognized Sentence</div>
                <div class="sentence-value" id="sentenceValue">Waiting for hands...</div>
            </div>

            <div class="meter-wrapper">
                <div class="meter-label">
                    <span>Confidence Score</span>
                    <span id="confidenceText">0.0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="audio-indicator" id="audioIndicator" style="visibility: hidden;">
                <span>🔊 Speaking sentence...</span>
            </div>
        </div>
    </div>

    <script>
        const handDot = document.getElementById('handDot');
        const handText = document.getElementById('handText');
        const bufferDot = document.getElementById('bufferDot');
        const bufferText = document.getElementById('bufferText');
        const fpsText = document.getElementById('fpsText');

        const sentenceValue = document.getElementById('sentenceValue');
        const confidenceText = document.getElementById('confidenceText');
        const progressFill = document.getElementById('progressFill');
        const audioIndicator = document.getElementById('audioIndicator');
        const uploadStatus = document.getElementById('uploadStatus');

        // Periodically fetch status from server-side OpenCV inference engine every 100ms
        setInterval(async () => {
            try {
                const response = await fetch('/api/camera_status');
                const data = await response.json();

                if (data.hands_detected > 0) {
                    handDot.classList.add('active');
                    handText.innerText = `${data.hands_detected} Hand${data.hands_detected > 1 ? 's' : ''}`;
                } else {
                    handDot.classList.remove('active');
                    handText.innerText = "0 Hands";
                }

                if (data.buffer_size === data.buffer_capacity) {
                    bufferDot.classList.add('active');
                } else {
                    bufferDot.classList.remove('active');
                }

                bufferText.innerText = `${data.buffer_size}/${data.buffer_capacity} Frames`;
                fpsText.innerText = `${data.fps} FPS (${data.inference_time_ms}ms)`;

                sentenceValue.innerText = data.stable_sentence;
                confidenceText.innerText = `${data.confidence}%`;
                progressFill.style.width = `${data.confidence}%`;

                if (data.is_speaking) {
                    audioIndicator.style.visibility = 'visible';
                } else {
                    audioIndicator.style.visibility = 'hidden';
                }
            } catch (err) {
                console.error("Status fetch error:", err);
            }
        }, 100);

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            uploadStatus.innerText = "Processing video...";
            sentenceValue.innerText = "Processing uploaded video...";

            const formData = new FormData();
            formData.append('video', file);

            try {
                const response = await fetch('/api/predict_video', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.status === 'success') {
                    sentenceValue.innerText = data.prediction;
                    confidenceText.innerText = `${data.confidence}%`;
                    progressFill.style.width = `${data.confidence}%`;
                    uploadStatus.innerText = `Done in ${data.processing_time_sec}s!`;
                } else {
                    sentenceValue.innerText = "Error: " + (data.error || "Failed to process video");
                    uploadStatus.innerText = "Failed";
                }
            } catch (err) {
                console.error("Upload error:", err);
                sentenceValue.innerText = "Upload failed: " + err.message;
                uploadStatus.innerText = "Error";
            }
        }

        async function clearBuffer() {
            try {
                await fetch('/api/clear', { method: 'POST' });
                sentenceValue.innerText = "Buffer cleared";
                progressFill.style.width = "0%";
                confidenceText.innerText = "0.0%";
                audioIndicator.style.visibility = 'hidden';
            } catch (err) {
                console.error("Clear buffer error:", err);
            }
        }
    </script>
</body>
</html>
