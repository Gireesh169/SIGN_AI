<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Multilingual Classroom | SIGN-AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/classroom.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span>🎓</span>
            <a href="/" style="color: inherit; text-decoration: none; font-weight: 800;">Multilingual Inclusive Classroom</a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <div class="container" style="max-width: 550px; margin-top: 2.5rem;">
        <div class="glass-card">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center; color: var(--text-main);">🎓 Join Virtual Classroom</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Enter your student details and choose your preferred language for real-time translation.</p>

            {% if error %}
            <div style="background: var(--accent-red-bg); border: 1px solid var(--accent-red-border); padding: 0.8rem; border-radius: 0.5rem; color: var(--accent-red); margin-bottom: 1.5rem; text-align: center; font-weight: 600;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/api/join_room" method="POST">
                <div class="form-group">
                    <label>Student Name *</label>
                    <input type="text" name="student_name" class="form-control" placeholder="e.g. Rahul Kumar" required>
                </div>

                <div class="form-group">
                    <label>Room Code *</label>
                    <input type="text" name="room_code" class="form-control" placeholder="e.g. SIGN-4821" style="text-transform: uppercase; font-weight: 700; letter-spacing: 2px;" required>
                </div>

                <!-- STUDENT PREFERRED LANGUAGE SELECTION -->
                <div class="form-group" style="background: var(--accent-green-bg); border: 1px solid var(--accent-green-border); padding: 1.25rem; border-radius: 0.75rem;">
                    <label style="color: var(--accent-green); font-weight: 700; font-size: 0.95rem;">🌐 What language would you like to receive classroom instructions in? *</label>
                    <p style="font-size: 0.825rem; color: var(--text-muted); margin-bottom: 0.6rem;">Teacher speech will be automatically translated into this language for you.</p>
                    <select name="student_preferred_language" class="form-control" style="background: #ffffff; color: var(--text-main); font-size: 1rem; font-weight: 600;">
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi (हिन्दी)</option>
                        <option value="te">Telugu (తెలుగు)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Password (If required)</label>
                    <input type="password" name="password" class="form-control" placeholder="Optional password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 1rem; margin-top: 1rem;">🚪 Enter Classroom</button>
            </form>
        </div>
    </div>
</body>
</html>
